[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gujbraille"
version = "1.3.0"
description = "Optical Braille recognition for printed/embossed Gujarati Braille: segmentation, CNN cell classifier and rule-based Gujarati conversion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24", "opencv-python-headless>=4.8", "scikit-learn>=1.3",
  "scikit-image>=0.21", "scipy>=1.10", "tensorflow>=2.15",
  "pymupdf>=1.23", "pillow>=9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gujbraille = "gujbraille.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
